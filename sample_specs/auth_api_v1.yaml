openapi: 3.0.0
info:
  title: CloudAuth Identity Service
  version: 1.0.0
  description: Centralized authentication, OAuth2 token issuance, and user lifecycle API.
paths:
  /api/v1/auth/token:
    post:
      summary: Issue OAuth2 Token
      description: Issues access tokens. Caller may optionally provide client_secret for public single-page applications. Rate limited to 1000 requests per minute per IP.
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: client_secret
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Token issued successfully.

  /api/v1/users/{id}:
    delete:
      summary: Deactivate User Account
      description: Flags user account as archived. Preserves data for 30-day grace period.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User soft-deleted.
